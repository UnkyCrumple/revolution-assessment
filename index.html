 "In March 1765, Parliament passed the Stamp Act. After that, newspapers, legal papers, licenses, and even playing cards needed a tax stamp. It was the first direct tax Parliament placed on the colonies.{1}",

 "Some colonists went further. Groups called the Sons of Liberty pressured the men chosen to sell the stamps. In Boston, protesters hung a stuffed figure of the stamp seller, Andrew Oliver, from a tree. He soon quit.{2} Across the colonies, stamp sellers were pressured to quit, and without sellers the tax could not be collected.{2}",
 "Merchants also boycotted British goods. The boycotts hurt British businesses, so Parliament repealed the Stamp Act in March 1766. On the same day it passed the Declaratory Act, which said Parliament could make laws for the colonies “in all cases whatsoever.”{1}"],
 words:[["direct tax","a tax paid straight to the government"],["repeal","to cancel a law"],["boycott","to refuse to buy something as a protest"],["assembly","a colony’s elected lawmaking group"]],
 ev:["The Stamp Act was the first direct tax Parliament placed on the colonies.{1}","The Stamp Act Congress (nine colonies) said only their own elected assemblies could tax them.{1}","Pressure on stamp sellers meant the tax could not be collected.{2}","Boycotts hurt British businesses, and Parliament repealed the law in 1766. The Declaratory Act the same day claimed power over the colonies “in all cases whatsoever.”{1}"],
 look:"Historians still debate the Sons of Liberty’s methods, which included frightening people and destroying property.{2} Is that part of “resisting,” or does it make the cause less justified? Does the idea (consent) deserve more credit than the method?",
 src:["stamp","riots"],
 teach:"Matrix Readings 6 and 7. Accuracy note carried from the Matrix: “terrorist” as a label for the Sons of Liberty is a modern, loaded word. Use it only as a word-choice discussion. Strong CERs separate the IDEA (consent) from the METHOD (pressure, property damage)."},
{id:"1b",sec:1,name:"The Tea Party and the Intolerable Acts",icon:"🫖",
 hook:"A big company gets a special deal, and buying its cheap product would mean accepting a rule you think is unfair. What do you do?",
 read:[
 "In 1773, Parliament passed the Tea Act to save the British East India Company. Its tea became cheaper than smuggled tea. But many Patriots said buying it meant accepting Parliament’s right to tax them without their consent.{1}",
 "On December 16, 1773, a huge crowd met at Boston’s Old South Meeting House. The governor would not let the tea ships leave. That night, men disguised as Mohawk men boarded three ships and dumped 342 chests of tea into Boston Harbor. They destroyed only the tea.{2}",
 "Many colonists cheered. In Britain, destroying private property was almost universally condemned. King George III and Parliament decided Boston must be punished.{2}",
 "In 1774, Parliament passed four laws that colonists called the Intolerable Acts. The Boston Port Act closed the harbor until the town paid for the tea. The Massachusetts Government Act took away much of the colony’s charter, so the king, not voters, would choose members of the governor’s council.{3} Other colonies sent food and supplies to Boston, and leaders called for a meeting of all the colonies.{3}"],
 words:[["monopoly","when one company controls all sales of a product"],["charter","an official document that sets up a colony’s government"],["consent","agreement or permission"]],
 ev:["Men dumped 342 chests of tea into Boston Harbor. They destroyed only the tea.{2}","In Britain, destroying the tea was widely condemned as destroying private property.{2}","The Boston Port Act closed Boston Harbor until the town paid for the tea.{3}","The Government Act ended elected council members. The king would choose them.{3}","Many colonists argued the Port Act punished a whole town for what a few people did.{3}"],
 look:"Was dumping the tea a fair protest? Was closing the harbor a fair punishment? Notice that your answers can be different for each.",
 src:["tea2","tea","intol"],
 teach:"Matrix Readings 12, 14, 15. Do not state a precise number of participants; the Matrix notes accounts range from about 60 to more than 100. The collective-punishment point gives students two-sided evidence for the CER."},
{id:"1c",sec:1,name:"The First Continental Congress and the Boycott",icon:"🏛️",
 hook:"Twelve colonies in one room. How do you get people who barely know each other to act as one?",
 read:[
 "After the Intolerable Acts, leaders agreed the colonies had to answer together. In September 1774, more than fifty delegates from twelve colonies met at Carpenters’ Hall in Philadelphia. Georgia did not take part because its royal governor blocked the vote to choose delegates.{1}",
 "On October 14, Congress approved a Declaration and Resolves. It listed colonists’ rights and complaints. One resolve said that an army kept in a colony in peacetime, without its legislature’s consent, is against the law.{2}",
 "Later that month, Congress approved the Continental Association. Starting December 1, 1774, colonists would stop buying British goods. Later, they would also stop selling goods to Britain if nothing changed. Local committees would enforce the boycott.{1}{3}",
 "The Association also said colonists would “neither import nor purchase, any slave.”{4}"],
 words:[["delegate","a person chosen to speak and vote for others"],["boycott","to refuse to buy something as a protest"],["standing army","an army kept ready in peacetime"]],
 ev:["Delegates from twelve colonies met in 1774. Georgia’s royal governor blocked its delegates.{1}","The Resolves said a peacetime army in a colony without its legislature’s consent was against the law.{2}","The Association began a boycott of British goods on December 1, 1774, enforced by local committees.{1}{3}","The Association promised not to import or buy enslaved people.{4}"],
 look:"A boycott uses buying power instead of weapons. Why might a group try a boycott first? Also think about this: the National Park Service estimates that about 450,000 of the roughly 500,000 people of African descent in the colonies were enslaved when the war began.{5} What does that add to the colonists’ talk about liberty?",
 src:["cc1","resolves","assoc","encassoc","npsfort"],
 teach:"Matrix Reading 16. Consent & Voice thread: delegates were picked by assemblies or conventions, and Georgia was blocked by its governor. The Matrix also notes the Galloway plan lost 6–5, so the delegates did not all agree. The “not import or purchase any slave” clause is cited from Encyclopedia.com’s excerpt; students can check the Avalon or ABT text of the Association."},
{id:"1d",sec:1,name:"The Declaration of Independence: Making the Case",icon:"📜",
 hook:"If you wanted the whole world to understand why you are breaking away, how would you build your argument?",
 read:[
 "On July 4, 1776, Congress approved the Declaration of Independence. It makes its case in three steps.",
 "Step 1: Ideas. Governments get their “just powers from the consent of the governed.” If a government harms people’s rights, people have the right “to alter or to abolish it.”{1}",
 "Step 2: Evidence. A long list of complaints against King George III. They include taxes imposed “without our Consent,” being denied trial by jury, and armies kept among the colonists. Some match events you studied, such as soldiers quartered among colonists and cutting off trade.{1}",
 "Step 3: Conclusion. The colonies are, and have a right to be, “Free and Independent States.”{1}",
 "But the promise of equality did not reach everyone. Jefferson wrote the first draft, and Congress cut his paragraph that blamed the king for the slave trade.{2}{3} Jefferson himself enslaved over six hundred people in his lifetime.{3} The Declaration also blames the king for stirring up “merciless Indian Savages” on the frontier. That is the document’s own harsh wording about Native people.{1}"],
 words:[["consent","agreement or permission"],["abolish","to end something completely"],["grievance","a complaint about unfair treatment"]],
 ev:["The Declaration says governments get their just powers “from the consent of the governed.”{1}","It lists complaints including taxes “without our Consent” and loss of trial by jury.{1}","Congress removed Jefferson’s paragraph criticizing the slave trade.{2}","Over his lifetime Jefferson enslaved more than 600 people.{3}"],
 look:"The Declaration has an idea, evidence, and a conclusion. Is the evidence strong enough for the idea? And is the idea the same for everyone it names?",
 src:["decl","jeffmonti","jeffclass"],
 teach:"Utah guiding question: How does the Declaration make a case for a new nation? Portfolio bridge: the Declaration as a model for a student petition (idea, grievances, request). The “merciless Indian Savages” phrase is quoted from the National Archives transcript so students see the document’s own wording; frame it as the document’s language, not a fact."},
/* ---------- SECTION 2 ---------- */
{id:"2a",sec:2,name:"Saratoga and the French Alliance",icon:"🇫🇷",
 hook:"Why would a king help rebels fight another king?",
 read:[
 "In 1777, American forces beat British General Burgoyne’s army at Saratoga, New York. The American Battlefield Trust calls this a turning point of the Revolution.{1}",
 "France had been secretly helping since spring 1776, starting with gunpowder.{1} After news of Saratoga reached Paris, France agreed to open help. Benjamin Franklin helped make the treaties, which were signed on February 6, 1778.{1}",
 "France’s reasons were practical. Some historians describe the American Revolution as part of a long rivalry between France and Britain called the “Second Hundred Years War.”{2} Over the war, France provided an estimated 12,000 soldiers and 32,000 sailors.{3}"],
 words:[["alliance","an agreement to help each other"],["turning point","a moment when the direction of events changes"],["covert","secret"],["rival","a country or person competing against another"]],
 ev:["Secret French aid began in spring 1776 with gunpowder.{1}","France signed treaties with the United States in February 1778, after Saratoga.{1}","France sent an estimated 12,000 soldiers and 32,000 sailors.{3}"],
 hist:[["Tom Shachtman (author, How the French Saved America)","French aid was crucial and is often forgotten. But France did not join out of sympathy for the American Revolution or republican ideas. It acted for its own reasons.{4}"],["A college textbook, “The Patriot Advantage”","Historians admit British mistakes, but they also credit French aid and George Washington’s leadership. The textbook says the American people decided the outcome, especially the one-third of white colonists who were zealous Patriots.{5}"]],
 look:"Both views agree France mattered. Where do they place the most credit: on France, or on the Americans themselves?",
 src:["abtfrance","abtfr2","abtfrtopic","hnnfr","henretta"],
 teach:"Standard 3.2 asks students to compare interpretations. ABT is a nonprofit with a preservation mission (see the Battle Briefing’s sourcing check). The textbook pages are cited by page title because no author is shown. These are secondary and popular sources, not journal articles. To raise rigor, upload historiography articles and I will add them here."},
{id:"2b",sec:2,name:"Washington’s Army Survives",icon:"🏕️",
 hook:"Can you win a war just by not losing?",
 read:[
 "The Continental Army was mostly farmers and merchants, not professional soldiers. Its inexperience put its existence at risk. So did its reliance on militia (citizen volunteers), who could be unreliable.{1}",
 "After a string of defeats around New York in 1776, American leaders changed their plan.{1} The American Battlefield Trust sums up the new idea: “so long as the Continental Army existed in the field, the Revolution was alive.”{1}",
 "Britain had problems too. Its supplies were uncertain. It also repeatedly left Loyalists (colonists loyal to the king) at the mercy of angry rebels.{2}"],
 words:[["militia","citizen volunteers who fight for their community"],["Loyalist","a colonist who stayed loyal to the king"],["supply","food, weapons, and gear an army needs"]],
 ev:["Most Continental soldiers were farmers and merchants, not professional soldiers.{1}","One article says the Revolution was alive as long as the army existed in the field.{1}","A textbook lists British supply trouble and neglect of Loyalists among reasons Britain lost.{2}"],
 hist:[["American Battlefield Trust article (no author listed)","The army’s survival kept the Revolution alive even after defeats. Inexperience and shaky militia nearly ended it.{1}"],["A college textbook, “Conclusion: Why the British Lost”","A majority of colonists were neutral or loyal. So why did Britain lose? The textbook points to supply problems, mistreating Loyalists, and French help.{2}"],["A college textbook, “The Patriot Advantage”","Washington’s leadership helped the American side win.{3}"]],
 look:"Did America win the war, or did Britain lose it? Why might both be partly true?",
 src:["abtstrat","tap","henretta"],
 teach:"The ABT strategy article has no listed author. Note that the two textbook pages give different pictures of Patriot strength (one-third zealous Patriots vs. a majority neutral or loyal); the point for students is that estimates differ. Pair with the Battle Briefing."},
{id:"2c",sec:2,name:"The War in the South",icon:"🌴",
 hook:"The war moves south, and so does the fighting between neighbors.",
 read:[
 "For the first four years, Britain focused on the Northern and Middle colonies. Then it tried a new plan in the South.{1} British forces captured Savannah, Georgia, in December 1778. In Georgia, thousands of enslaved people ran to the British side to escape slavery.{2}",
 "In May 1780, the British took Charleston, South Carolina, and the American Southern Army surrendered.{3}",
 "General Nathanael Greene lost many battles, but he pushed the British out of the interior and back to Charleston.{1} The Americans used a tactic called defense in depth: forming several lines of battle.{1}"],
 words:[["campaign","a series of battles with one goal"],["defense in depth","setting up several lines of battle, one behind the other"],["surrender","to give up"]],
 ev:["Britain captured Savannah in December 1778 and Charleston in May 1780.{2}{3}","Greene lost many battles but pushed the British back to Charleston.{1}","In Georgia, thousands of enslaved people ran to the British side.{2}"],
 hist:[["National Park Service (Cowpens)","The Battle of Cowpens was the turning point of the war in the South.{4}"],["American Battlefield Trust","Greene’s defense in depth, a method used over many fights, is what pushed the British back.{1}"]],
 look:"One source points to a single battle as the turning point. Another points to a method used again and again. Which explanation seems stronger to you?",
 src:["abtsouth","lumsouth","abtcamden","npscowp"],
 teach:"Fills the Battle Briefing’s follow-up gap (southern campaign). Phrase the British shift as “by 1778–79”; sources date it slightly differently. Do not state casualty numbers here; the ABT figures were flagged for review in the Battle Briefing."},
{id:"2d",sec:2,name:"Yorktown and the Treaty of Paris",icon:"🚢",
 hook:"Was the war over when the last big battle ended?",
 read:[
 "In fall 1781, British General Cornwallis and his army of about 9,000 were at Yorktown, Virginia.{1}",
 "On September 5, a French fleet beat a British fleet at the Battle of the Capes. The British fleet had to leave Cornwallis behind. He was trapped.{1} Washington’s army and a French army marched south from New York, and French ships helped move troops down Chesapeake Bay.{2}",
 "On October 19, 1781, Cornwallis surrendered. Sources give different numbers. One says about 8,000 surrendered.{2} Another describes Cornwallis’s army as 9,000 men.{1}",
 "But the war did not officially end. Peace talks in Paris began in 1782 with Benjamin Franklin, John Jay, and John Adams. The Treaty of Paris was not signed until September 3, 1783.{3}{4}"],
 words:[["siege","surrounding a place to force it to give up"],["fleet","a group of warships"],["treaty","a written agreement between countries"]],
 ev:["A French fleet beat the British fleet on September 5, 1781, and trapped Cornwallis at Yorktown.{1}","Cornwallis surrendered on October 19, 1781.{1}","The Treaty of Paris was signed September 3, 1783, nearly two years after Yorktown.{3}{4}"],
 hist:[["American Battlefield Trust","The French naval victory left Cornwallis trapped.{1}"],["A History News Network article","Counting sailors, about 29,000 French were at Yorktown, compared with about 12,000 Americans.{5}"],["Library of Congress","Peace talks began after Yorktown, but the treaty took until September 1783. Yorktown did not end the war by itself.{3}"]],
 look:"Is Yorktown best called an American victory, a French victory, or an allied victory? Use the numbers and the dates.",
 src:["abtyork","histyork","locparis","natparis","hnnyork"],
 teach:"Numbers differ (History.com: 8,000 surrendered; ABT: 9,000-man army), so require students to say “numbers vary.” The HNN article’s author is not shown in the search record; cite by outlet. Utah standard 3.2 wants interpretations compared, so push students to name which source they are using."},
/* ---------- SECTION 3 ---------- */
{id:"3a",sec:3,name:"Paul Revere: The Ride and the Legend",icon:"🐎",
 hook:"You have probably heard the poem. But what did Revere himself say happened?",
 read:[
 "Paul Revere was a Boston Patriot who worked as a messenger for the Massachusetts Provincial Congress.{1}",
 "On April 18, 1775, Dr. Joseph Warren urged Revere to ride to Lexington to warn John Hancock and Samuel Adams that British troops were on the move.{2}",
 "Revere wrote about that night three times. Two accounts, both from 1775, were requested by the Provincial Congress, which wanted proof that the British fired first. The third was a letter written about 23 years later to Jeremy Belknap of the Massachusetts Historical Society.{3}{2}",
 "Revere’s role got little attention in history books until after his death in 1818. In 1863, Henry Wadsworth Longfellow wrote a poem that cast Revere as a national hero. The Massachusetts Historical Society calls it highly romanticized.{4}"],
 words:[["deposition","a sworn statement about what you saw"],["express rider","a messenger who rides fast to carry news"],["romanticized","made to seem more heroic or beautiful than real life"]],
 ev:["Revere wrote three accounts: two depositions in 1775 and a letter about 23 years later.{3}","The 1775 depositions were requested to prove the British fired first.{3}","Revere’s role was little noticed until after he died. Longfellow’s 1863 poem made him a hero.{4}"],
 look:"Read Revere’s own letter (link in the sources: MHS transcription). Why might a deposition made in 1775 and a letter written in 1798 be different? Which would you trust more, and why?",
 src:["revalarm","revletter","revhouse","revnote"],
 teach:"Primary-source work: students can read the MHS transcription of Revere’s 1798 letter (masshist.org/objects/cabinet/april2002/reveretranscription.htm). I have NOT checked every detail of the ride (such as who reached Concord); read the transcription yourself before telling students more than is on this page. Fact Check Alert: Longfellow’s poem is a legend; rely on Revere’s own accounts."},
{id:"3b",sec:3,name:"Thomas Paine and Common Sense",icon:"📘",
 hook:"How do you convince people who never read pamphlets to support independence?",
 read:[
 "Thomas Paine was born in England in 1737. He arrived in Philadelphia in early 1775 and had been in North America only about a year when Common Sense came out.{1}",
 "Common Sense was published in January 1776. Paine used plain, short, forceful sentences so ordinary colonists could follow him. He also used the Bible, which most readers knew well, to support his points.{1}",
 "It could be read aloud in taverns and coffeehouses, so it reached people who never bought a copy. Historians estimate 50,000 to 120,000 copies were bought, and a second edition came a month later.{1}",
 "Not everyone agreed. Letters arguing against Common Sense appeared during the first half of 1776.{2} Paine wrote: “We have it in our power to begin the world over again.”{2}"],
 words:[["pamphlet","a short printed booklet about one topic"],["independence","freedom from another country’s rule"],["tavern","a place where people met to eat, drink, and talk"]],
 ev:["Common Sense was published in January 1776, and 25 more editions followed within a year.{1}","Estimates of copies bought range from 50,000 to 120,000.{1}","Paine used plain language and Bible references so ordinary readers could follow.{1}","Letters opposing Common Sense appeared in early 1776.{2}"],
 look:"Paine wrote for ordinary people, not just leaders. How does that connect to the idea that government needs “the consent of the governed”?",
 src:["paine","cw1776"],
 teach:"Primary source: students may read Paine’s own words through the Colonial Williamsburg link. The sales range is a teaching point (historians do not know exactly). Do not give a page count; sources vary."},
{id:"3c",sec:3,name:"Abigail Adams: “Remember the Ladies”",icon:"💌",
 hook:"What if the people writing the new laws left half the country out?",
 read:[
 "In March 1776, Abigail Adams was at home in Braintree, Massachusetts. Her husband John was in the Continental Congress in Philadelphia. She and the children were living through the British siege of Boston and a smallpox epidemic.{1}",
 "On March 31, she wrote to John about the “new code of laws” Congress might make.{4} She asked him to “remember the ladies.” At that time, married women had few legal rights.{2} She also asked him not to put unlimited power into husbands’ hands.{2}",
 "John answered on April 14: “I cannot but laugh” at her “extraordinary Code of Laws.” He wrote that men’s rule was “in full Force,” but “little more than Theory.”{5}{3}",
 "Historians still discuss what she meant. Smithsonian Magazine notes her request was open-ended and is often misunderstood today.{4}"],
 words:[["code of laws","a set of rules for a country"],["coverture","the old legal idea that a wife’s legal identity was covered by her husband’s"],["siege","surrounding a place to force it to give up"]],
 ev:["Abigail Adams wrote to John on March 31, 1776, asking him to “remember the ladies.”{2}","In 1776, married women had few legal rights.{2}","John replied on April 14 that he “cannot but laugh.”{5}"],
 look:"Abigail had no vote. How did she try to be heard? Compare her method with the Daughters of Liberty’s boycotts. Who in our school has a voice but no vote?",
 src:["abmck","abgbh","abletters","absmith","abjohn"],
 teach:"Primary source: full letters are in the Adams Family Papers (MHS) and the House Divided transcription. The Smithsonian piece is cited only for the fact that the request is read different ways; I have not summarized its argument. Portfolio bridge: voice without a vote."},
{id:"3d",sec:3,name:"Thomas Jefferson and the Committee of Five",icon:"🪶",
 hook:"Who wrote the Declaration: one man, or a whole room?",
 read:[
 "Congress named a Committee of Five: John Adams, Benjamin Franklin, Thomas Jefferson, Robert Livingston, and Roger Sherman. Jefferson wrote the first draft between June 11 and June 28, 1776, while staying in a bricklayer’s house on Market Street in Philadelphia.{1}",
 "Jefferson is called the main author, but the committee and Congress changed his draft. The Library of Congress counts 86 changes.{2}{3}",
 "One big cut was a paragraph that blamed the king for the slave trade. Monticello says slaveholding delegates from South Carolina and Georgia demanded its removal. Jefferson was unhappy about the cut.{4}{2}",
 "Jefferson himself enslaved over six hundred people in his lifetime.{5}"],
 words:[["draft","an early version of a piece of writing"],["committee","a small group chosen to do a job"],["slave trade","buying and selling people as property"]],
 ev:["Jefferson wrote the first draft between June 11 and June 28, 1776.{1}","The draft got 86 changes from the committee and Congress.{3}","Congress cut a paragraph criticizing the slave trade.{2}{4}","Jefferson enslaved over 600 people in his lifetime.{5}"],
 look:"Jefferson’s own recollection (in his Autobiography) was simple: the committee asked him to write it, and he did.{1} Does it matter whose idea each part was? What does the cut paragraph tell you about who the Declaration was written for?",
 src:["nypl","jeffmonti","locjeff","jeffslave","jeffclass"],
 teach:"Primary source: Jefferson’s rough draft with the cut passage is at the Library of Congress and NYPL. The “86 changes” count is the Library of Congress’s; some websites give different counts, so cite the source. Keep the focus on contribution plus contradiction."},
{id:"3e",sec:3,name:"The Sons and Daughters of Liberty",icon:"🌳",
 hook:"Some of the Revolution’s strongest power came from people who could not vote.",
 read:[
 "The Sons of Liberty began in 1765 as protest groups against the Stamp Act. They became a network for organizing protests and boycotts, and later helped plan the Boston Tea Party.{1}",
 "Women could not vote or hold office, but they powered many boycotts. A boycott only works if families stop buying. Women held spinning bees, where 20 to 40 women or more spun yarn all day so families could wear homespun cloth instead of British fabric. Many were organized by the Daughters of Liberty.{2}",
 "On October 25, 1774, fifty-one women in Edenton, North Carolina, signed a public statement supporting the boycott.{3}",
 "Look closely at this primary source. Newspapers printed the women’s statement, including the Virginia Gazette and, in January 1775, a London paper.{4} Sources disagree on its exact words. One North Carolina history site says the resolves never named tea.{5} A 1775 London cartoon shows the women’s paper as a promise about drinking tea.{6}"],
 words:[["homespun","cloth made at home instead of bought"],["spinning bee","a gathering to spin yarn together"],["resolve","a formal group decision or promise"]],
 ev:["The Sons of Liberty organized protests and boycotts across the colonies.{1}","Women could not vote but powered boycotts through spinning bees and refusing British goods.{2}","Fifty-one women signed the Edenton statement on October 25, 1774.{3}","Sources disagree on whether the Edenton statement named tea.{5}{6}"],
 look:"Compare the methods of the Sons and the Daughters. Which group did more to make the boycott work? Why would a British cartoonist make fun of the Edenton women?",
 src:["riots","wom","ednc","edtah","edmosaic","edcw"],
 teach:"Matrix Readings 7 and 13. Accuracy note carried from the Matrix: no reputable source found names Mercy Otis Warren as leader of the Daughters of Liberty; she was a playwright and satirist. Students can read the Edenton statement itself through source 4 (Teaching American History). The sources conflict about the tea wording, which is deliberate."},
{id:"3f",sec:3,name:"Choosing Sides: Black Americans and Native Nations",icon:"⚖️",
 hook:"The Declaration said “all men are created equal.” What did freedom mean if you were enslaved, or if your nation’s land was at stake?",
 read:[
 "In November 1775, Virginia’s royal governor, Lord Dunmore, promised freedom to enslaved people owned by Patriots if they escaped and fought for the British.{1} Colonial Williamsburg says it could free some people but was first a military move to help Dunmore regain control.{2} One estimate says upwards of 20,000 formerly enslaved people joined the British side.{3}",
 "Black men also fought for the Patriots. At least 5,000 free and enslaved people of African descent served the Patriot cause.{4} Most served in integrated units, with equal pay and rations.{5} George Washington first ordered that Black men could not enlist.{3}",
 "Native nations had to choose too. The Haudenosaunee (Six Nations) split. In broad terms, the Oneida and Tuscarora allied with the United States, and the Mohawk, Onondaga, Cayuga, and Seneca with Great Britain.{6} Historians say both sides pressured Native people to join.{7}",
 "After the war, the United States dictated a treaty to the Six Nations in 1784, treating the four nations that sided with Britain as defeated enemies, which the National Park Service says they were not.{6}",
 "Many colonists were also Loyalists or stayed neutral. Historians estimate between one-fifth and one-third of colonists were Loyalists.{8}"],
 words:[["Loyalist","a colonist who stayed loyal to the king"],["neutral","not taking either side"],["proclamation","an official public order"]],
 ev:["Dunmore’s Proclamation (Nov. 7, 1775) promised freedom to enslaved people of Patriots who fought for the British.{1}","At least 5,000 Black soldiers and sailors served the Patriot cause, mostly in integrated units.{4}{5}","The Oneida and Tuscarora allied with the United States. The Mohawk, Onondaga, Cayuga, and Seneca allied with Britain.{6}","Loyalists were between one-fifth and one-third of colonists, by historians’ estimates.{8}"],
 look:"What led different people to choose different sides? For enslaved people and for Native nations, what did each side promise, and could they trust it?",
 src:["dunev","duncw","dunhist","npsfort","npsblack","nps1784","smithnat","scholastic"],
 teach:"Utah guiding question: What led some colonists to become Patriots, Loyalists, or neutral? This stop widens that to enslaved and Native people. Numbers are estimates, so teach “estimates differ.” The Haudenosaunee split is cited “in broad terms” per NPS."},
/* ---------- SECTION 4 ---------- */
{id:"4a",sec:4,name:"Seneca Falls (1848): Borrowing the Declaration",icon:"👩",
 hook:"Why would reformers copy a 72-year-old document to ask for new rights?",
 read:[
 "In July 1848, the first Women’s Rights Convention met at the Wesleyan Chapel in Seneca Falls, New York.{1} Elizabeth Cady Stanton read the Declaration of Sentiments, and the convention then passed 12 resolutions.{2}",
 "The Declaration of Sentiments copied the Declaration of Independence on purpose. It said “all men and women are created equal.”{1} Sixty-eight women and 32 men signed it.{3}",
 "It used the Declaration’s own argument to ask for the same rights for women.{4}"],
 words:[["sentiments","feelings and opinions"],["convention","a large meeting for a purpose"],["resolution","a formal statement of what a group wants"]],
 ev:["The 1848 Declaration of Sentiments said “all men and women are created equal.”{1}","Sixty-eight women and 32 men signed.{3}","It was modeled on the Declaration of Independence.{1}{4}"],
 look:"Which words did the writers keep, and which did they change? Why did borrowing the old document make the new demand stronger?",
 src:["senwori","senbrit","senlfj","senneh"],
 teach:"Then → Now thread: ideas from 1776 reused later. The sources are NPS, Britannica, Learning for Justice, and NEH EDSITEment; students can compare the two texts side by side using the NEH page."},
{id:"4b",sec:4,name:"Gettysburg (1863): “Four Score and Seven Years Ago”",icon:"🕊️",
 hook:"Why did Lincoln start a Civil War speech by going back to 1776?",
 read:[
 "On November 19, 1863, in the middle of the Civil War, President Abraham Lincoln spoke at the dedication of a soldiers’ cemetery. It was in Gettysburg, Pennsylvania.{1}",
 "He began with “Four score and seven years ago.” A score is 20, so he meant 87 years earlier: 1776, the year of the Declaration of Independence.{1}{2}",
 "Lincoln said the nation was “conceived in Liberty, and dedicated to the proposition that all men are created equal.”{3}",
 "The National Constitution Center says Lincoln returned to those promises to commit the post-war nation to “a new birth of freedom.”{3} The Library of Congress also says the speech looks back to the Declaration.{4}"],

/* citations: {n} -> superscript link to stop.src[n-1] */
function cite(text,stop){
 return text.replace(/\{(\d+)\}/g,(m,n)=>{const k=stop.src[n-1];const s=SRC[k];if(!s)return"<sup class='c'>?</sup>";
  return `<sup class="c"><a href="${s[1]}" target="_blank" rel="noopener" title="${esc(s[0])}" aria-label="Source ${n}: ${esc(s[0])}">${n}</a></sup>`});
}
function boldTerms(text,list){
 let t=text;
 list.forEach(([w])=>{const re=new RegExp("\\b("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")\\b","i");
  if(!/<b>/.test(t)||true){t=t.replace(re,"<b>$1</b>")}});
 return t;
}
const plain=t=>t.replace(/\{\d+\}/g,"");

 <div class="card"><h2>CER rubric (my adaptation, revise for your grading policy)</h2>
 <table><tr><th></th><th>4 Extends</th><th>3 Meets</th><th>2 Approaching</th><th>1 Beginning</th></tr>
 <tr><td><b>Claim</b></td><td>Clear answer that also names a limit or exception</td><td>Clear answer to the question</td><td>Vague or only partly answers</td><td>Missing or off topic</td></tr>
 <tr><td><b>Evidence</b></td><td>Two or more accurate facts or quotes, with source numbers</td><td>At least one accurate fact with a source number</td><td>Fact with no source, or partly inaccurate</td><td>Opinion or no evidence</td></tr>
 <tr><td><b>Reasoning</b></td><td>Explains why AND connects to another stop or to Consent &amp; Voice</td><td>Explains why the evidence supports the claim</td><td>Restates the evidence</td><td>Missing</td></tr>
 <tr><td><b>Sources (Section 2)</b></td><td>Compares two historians or sources</td><td>Names one historian or source and says what they think</td><td>Mentions “historians” with no name</td><td>None</td></tr></table>
 <p class="note">The CER framework comes from McNeill &amp; Krajcik (see Sources and design). This rubric is a draft I wrote from it. It is not from a published instrument.</p></div>
 <div class="card"><h2>Fact Check Alerts to say out loud</h2><ul>
 <li><b>Revere:</b> Longfellow’s 1863 poem is a legend. Use Revere’s own accounts.</li>
 <li><b>Leutze painting:</b> painted 75 years later with known errors (Met).</li>
 <li><b>Edenton:</b> sources disagree on whether the statement named tea.</li>
 <li><b>Valley Forge vs. Morristown:</b> death counts differ by source, so call them estimates.</li>
 <li><b>Numbers:</b> Yorktown surrender, Loyalist share, and Common Sense sales all vary by source.</li>
 <li><b>Declaration wording:</b> “merciless Indian Savages” is the document’s language, not a fact about Native people.</li>
 <li><b>Dunmore:</b> historians call it first a military move, not a plan to end slavery.</li>
 <li><b>Sons of Liberty:</b> “terrorist” is a modern label. Discuss word choice.</li></ul>
 <p class="note">Fact Check Alerts are based on Butler et al. (2009), Psychological Science 20(9).</p></div>
 <div class="card"><h2>Known limits (please read)</h2><ul>
 <li>Section 2 historians come from a popular history, a nonprofit (American Battlefield Trust), and textbook pages. They are secondary. Standard 3.2 would be stronger with journal articles; upload some and I will rebuild the stops.</li>
 <li>The Revere stop does not retell the ride in detail. Read the MHS transcription before adding details.</li>
 <li>Check the Met page for Scott Manning Stevens’s full comments before quoting him.</li>
 <li>Reading level was checked with the Flesch–Kincaid formula and quoted primary sources raise it.</li></ul></div>
 ${SECS.map(s=>`<div class="card"><h3>Section ${s.n}: what strong answers include</h3><p>${esc(s.strong)}</p></div>`).join("")}`;
}

/* ===== router ===== */
function applyCode(raw){
 const v=(raw||"").trim().toLowerCase();
 if(v==="day2"){S.unlock2=true;save();toast("Day 2 unlocked");return true}
 if(v==="teach"){S.teacher=true;S.unlock2=true;save();toast("Teacher view on");return true}
 if(v==="student"){S.teacher=false;save();toast("Teacher view off");return true}
 if(v)toast("That code did not work.");
 return false;
}
function viewTeacher(){
 return `<div class="crumb"><a href="#home">← All sections</a></div><h1>Teacher</h1><div class="card"><h2>Enter a code</h2><p class="note">Your teacher gives you this code. Students do not need this page.</p><label for="tc">Code</label><div class="row"><input id="tc" type="text" maxlength="12" autocomplete="off" style="padding:8px;border:1px solid #8a96b3;border-radius:6px;font:inherit"><button class="btn" id="tgo">Apply</button></div></div>`;
}
function route(){
 const h=(location.hash||"#home").slice(1);
 let html="",bind=()=>{};
 try{
  const mSec=h.match(/^sec([1-4])$/),mStop=h.match(/^stop-(\w+)$/),mDb=h.match(/^debrief([12])$/);
  if(mSec){const n=+mSec[1];if(!allowed(n)){toast(why(n));location.hash="#home";return}html=viewSection(n);bind=()=>bindSection(n)}
  else if(mStop){const p=stopById(mStop[1]);if(!p){location.hash="#home";return}if(!allowed(p.sec)){toast(why(p.sec));location.hash="#home";return}html=viewStop(p.id);bind=()=>bindStop(p)}
  else if(mDb){html=viewDebrief(+mDb[1]);bind=()=>bindDebrief(+mDb[1])}
  else if(h==="work"){html=viewWork();bind=bindWork}
  else if(h==="sources")html=viewSources();
  else if(h==="guide")html=viewGuide();
  else if(h==="teacher"){html=viewTeacher();bind=()=>{const go=()=>{if(applyCode($("#tc").value)){location.hash="#home";route()}};$("#tgo").addEventListener("click",go);$("#tc").addEventListener("keydown",e=>{if(e.key==="Enter")go()})}}
  else html=viewHome();
 }catch(e){html=`<div class="card"><h2>Something went wrong</h2><p>${esc(e.message)}</p><a href="#home">Go home</a></div>`}
 $("#main").innerHTML=html;bind();window.scrollTo(0,0);
 $("#pb").style.width=(doneCount()/4*100)+"%";
 document.body.classList.toggle("teacher",!!S.teacher);
 if(window.speechSynthesis&&speechSynthesis.speaking)speechSynthesis.cancel();
}

/* ===== bindings ===== */
function copyText(text,fbSel){
 try{navigator.clipboard.writeText(text).then(()=>toast("Copied!"),()=>fallback(text,fbSel))}catch(e){fallback(text,fbSel)}
}
function fallback(text,sel){
 const el=$(sel||"#cpfb");if(!el){toast("Copy not available here.");return}
 el.innerHTML='<p class="note">Your browser blocked copying. Select all of this text and copy it yourself:</p><div class="pre" tabindex="0"></div>';
 const box=el.querySelector(".pre");box.textContent=text;
 try{const r=document.createRange();r.selectNodeContents(box);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)}catch(e){}
}
function bindSection(n){
 const stops=STOPS.filter(x=>x.sec===n);
 document.querySelectorAll(".stopcard").forEach(b=>b.addEventListener("click",()=>{
  const st=secState(n);if(!st.stop){st.stop=b.dataset.id;save()}
  location.hash="#stop-"+b.dataset.id}));
 $("#rnd").addEventListener("click",()=>{
  const st=secState(n);const pool=stops.filter(x=>x.id!==st.stop||stops.length<2);
  const final=pool[Math.floor(Math.random()*pool.length)];
  const cards=stops.map(x=>$("#card-"+x.id));
  const finish=()=>{cards.forEach(c=>c.classList.remove("rolling","pick"));$("#card-"+final.id).classList.add("pick");
   $("#rmsg").innerHTML=`🎲 Your stop: <b>${esc(final.name)}</b> <button class="btn" id="go">Explore it</button>`;
   $("#go").addEventListener("click",()=>{const s2=secState(n);if(!s2.stop){s2.stop=final.id}save();location.hash="#stop-"+final.id});
   $("#go").focus()};
  if(reduce()){finish();return}
  $("#rnd").disabled=true;let i=0;const total=14;
  const tick=()=>{cards.forEach(c=>c.classList.remove("rolling"));cards[i%cards.length].classList.add("rolling");i++;
   if(i<total)setTimeout(tick,80+i*12);else{$("#rnd").disabled=false;finish()}};
  tick();
 });
}
function bindStop(p){
 const n=p.sec,st=secState(n);
 if(window.speechSynthesis){const b=$("#tts");b.hidden=false;
  b.addEventListener("click",()=>{try{
   if(speechSynthesis.speaking){speechSynthesis.cancel();b.textContent="🔊 Listen";return}
   const txt=p.name+". "+p.hook+" "+p.read.map(plain).join(" ");
   const u=new SpeechSynthesisUtterance(txt);u.rate=.95;u.onend=()=>{b.textContent="🔊 Listen"};
   speechSynthesis.speak(u);b.textContent="⏹ Stop"}catch(e){toast("Read-aloud is not available.")}})}
 const mk=$("#mk");if(mk){mk.addEventListener("click",()=>{st.stop=p.id;save();route()});return}
 const f={claim:$("#f-claim"),ev:$("#f-ev"),rsn:$("#f-rsn")};
 const upd=()=>{["claim","ev","rsn"].forEach(k=>{$("#w-"+k).textContent=words(f[k].value)+" words"})};
 ["claim","ev","rsn"].forEach(k=>{f[k].value=st[k]||"";f[k].addEventListener("input",()=>{st[k]=f[k].value;save();upd()})});upd();
 document.querySelectorAll(".chk input").forEach(c=>{c.checked=!!st.chk[+c.dataset.i];c.addEventListener("change",()=>{st.chk[+c.dataset.i]=c.checked;save()})});
 const nChk=document.querySelectorAll(".chk input").length;
 $("#cp").addEventListener("click",()=>{
  const s=secBy(n);copyText(`Section ${n}: ${s.title}\nStop: ${p.name}\nQuestion: ${s.q}\nClaim: ${st.claim}\nEvidence: ${st.ev}\nReasoning: ${st.rsn}`)});
 $("#fin").addEventListener("click",()=>{
  const msg=$("#fmsg");const need=[];
  if(words(st.claim)<4)need.push("a claim (at least 4 words)");
  if(words(st.ev)<8)need.push("evidence (at least 8 words)");
  if(words(st.rsn)<12)need.push("reasoning (at least 12 words)");
  for(let i=0;i<nChk;i++)if(!st.chk[i]){need.push("all self-check boxes ticked");break}
  if(need.length){msg.textContent="Still needed: "+need.join(", ")+".";return}
  msg.textContent="";st.done=true;save();toast("Section "+n+" done! ✓");location.hash="#sec"+n});
}
function bindDebrief(d){
 const t=$("#exit");t.value=S.exit[d]||"";t.addEventListener("input",()=>{S.exit[d]=t.value;save()});
 $("#cpx").addEventListener("click",()=>copyText(t.value));
}
function bindWork(){$("#cpall").addEventListener("click",()=>copyText(buildWork()))}

/* ===== header controls ===== */
function applyFs(){document.documentElement.style.setProperty("--fs",S.fs+"px")}
$("#amin").addEventListener("click",()=>{S.fs=Math.max(14,S.fs-1);save();applyFs()});
$("#aplus").addEventListener("click",()=>{S.fs=Math.min(26,S.fs+1);save();applyFs()});
window.addEventListener("hashchange",route);
applyFs();route();
</script>
